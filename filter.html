<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FILTER - NAVIRA FINANCE</title>
  <link rel="stylesheet" href="style.css">

  <!-- SheetJS untuk Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>


  <!-- jsPDF & autotable untuk PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>

<body>

  <!-- FILTER -->
  <section class="filter-section">
    <h2>Filter Transaksi</h2>
    <div class="filter">
      <label for="filterjenis">Pilih Jenis</label>
      <select name="filterjenis" id="filterjenis">
        <option value="">Pilih</option>
        <option value="Pemasukan">Pemasukan</option>
        <option value="Pengeluaran">Pengeluaran</option>
      </select>

      <label for="filterMetode">Metode</label>
      <select id="filterMetode">
        <option value="">Semua Metode</option>
      </select>

      <label for="filterKategori">Kategori</label>
      <select id="filterKategori">
        <option value="">Semua Kategori</option>
      </select>


      <label for="bulan">Pilih Bulan</label>
      <select id="bulan">
        <option value="">Pilih</option>
        <option value="0">Januari</option>
        <option value="1">Februari</option>
        <option value="2">Maret</option>
        <option value="3">April</option>
        <option value="4">Mei</option>
        <option value="5">Juni</option>
        <option value="6">Juli</option>
        <option value="7">Agustus</option>
        <option value="8">September</option>
        <option value="9">Oktober</option>
        <option value="10">November</option>
        <option value="11">Desember</option>
      </select>

      <label for="tahun">Pilih Tahun</label>
      <input type="number" id="tahun" value="2025">

      <button onclick="terapkan()">Terapkan</button>
      <button onclick="resetfilter()">Reset</button>
    </div>
  </section>

  <!-- REKAP -->
  <section class="rekap-section">
    <div class="rekap-bulan">
      <div class="rekap-judul" id="judulBulan">-</div>
      <div class="rekap-row sisa">
        <span>Sisa saldo</span>
        <span id="sisaSaldo">Rp 0</span>
      </div>
      <div class="rekap-row">
        <span>Saldo keluar</span>
        <span id="saldoKeluar">Rp 0</span>
      </div>
      <div class="rekap-row">
        <span>Saldo masuk</span>
        <span id="saldoMasuk">Rp 0</span>
      </div>
    </div>

    <div class="export-wrapper">
      <button class="btn-export" id="btnExport">
        ⬇ Export
      </button>

      <div class="export-menu" id="exportMenu">
        <button onclick="exportExcel()">📊 Export Excel</button>
        <button onclick="exportPDF()">📄 Export PDF</button>
        <button onclick="exportSpreadsheet()">📈 Export Spreadsheet</button>
      </div>
    </div>

  </section>

  <hr>

  <!-- RIWAYAT -->
  <section class="riwayat-section">
    <h3>Riwayat Transaksi</h3>
    <div id="jumlahData" class="jumlah-data">Menampilkan 0 transaksi</div>
    <div id="riwayatTransaksi"></div>
  </section>

  <!-- NAVIGASI BAWAH -->
  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <img src="https://files.catbox.moe/uu97e9.png" alt="dash">
      <span>Dashboard</span>
    </a>
    <a href="transaksi.html" class="nav-item">
      <img src="https://files.catbox.moe/m09xkz.png" alt="transaksi">
      <span>Transaksi</span>
    </a>
    <a href="filter.html" class="nav-item">
      <img src="https://files.catbox.moe/kfd70x.png" alt="filter">
      <span>Filter</span>
    </a>
    <a href="filter.html" class="nav-item">
      <img src="https://files.catbox.moe/3c8dak.png" alt="history">
      <span>Riwayat</span>
    </a>
    <a href="profil.html" class="nav-item">
      <img src="https://files.catbox.moe/0hc0tq.png" alt="profile">
      <span>Profil</span>
    </a>
  </nav>

  <script src="filter.js"></script>
</body>

</html>
